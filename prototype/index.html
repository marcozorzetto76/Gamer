<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meteo Park</title>
<style>
:root{
  --ink:#26405c;
  --ink-soft:#5a7290;
  --panel:rgba(255,255,255,.82);
  --panel-solid:#ffffff;
  --chip:rgba(255,255,255,.92);
  --hill1:#8fd07c;
  --hill2:#63b95c;
  --radius:18px;
  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Nunito","Quicksand",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--display);
  color:var(--ink);
  overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:background 1.4s ease;
  background:linear-gradient(#4eb5f2 0%,#8ed4fa 55%,#dff3ff 100%);
}
body.w-sunny{background:linear-gradient(#3fadf0 0%,#8ed4fa 55%,#eaf8ff 100%)}
body.w-rain{background:linear-gradient(#5d7d9e 0%,#8aa6bf 55%,#c2d3e0 100%);--hill1:#6fa571;--hill2:#4f8a58}
body.w-storm{background:linear-gradient(#2c3a52 0%,#48597a 60%,#5c6e8a 100%);--hill1:#47695c;--hill2:#33544a}
body.w-snow{background:linear-gradient(#8fb9dd 0%,#c3dcef 55%,#eef6fc 100%);--hill1:#eaf4fc;--hill2:#cfe3f3}
body.w-fog{background:linear-gradient(#8b9ea9 0%,#b4c3cb 55%,#d5dde1 100%);--hill1:#9db3a0;--hill2:#7e9a84}
body.w-night{background:linear-gradient(#0e1738 0%,#22315e 60%,#33427a 100%);--hill1:#2a416d;--hill2:#1d3054}
body.w-rainbow{background:linear-gradient(#49b2ef 0%,#9edcfb 50%,#fdf3d8 100%)}
body.w-storm,body.w-night{--ink:#e8eefb;--ink-soft:#b6c3da}

#hills{position:fixed;bottom:0;left:0;width:100vw;height:16vh;min-height:110px;z-index:0;pointer-events:none}
.bgcloud{position:fixed;z-index:0;pointer-events:none;opacity:.9;animation:slide linear infinite}
.bgcloud svg{width:120px;height:auto}
#cl1{top:6vh;animation-duration:95s}
#cl2{top:15vh;animation-duration:140s;animation-delay:-60s;transform:scale(.7)}
@keyframes slide{from{left:-160px}to{left:105vw}}
body.w-night .bgcloud,body.w-fog .bgcloud{opacity:.25}

#particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.p-rain{position:absolute;top:-8vh;width:2.5px;height:15px;border-radius:2px;background:linear-gradient(rgba(255,255,255,.05),#cfe9ff);animation:fall linear infinite;transform:rotate(8deg)}
.p-snow{position:absolute;top:-6vh;border-radius:50%;background:#fff;opacity:.95;filter:blur(.4px);animation:fallsway ease-in-out infinite}
@keyframes fall{to{transform:rotate(8deg) translateY(120vh)}}
@keyframes fallsway{0%{transform:translate(0,-4vh)}50%{transform:translate(16px,55vh)}100%{transform:translate(-6px,115vh)}}
.starp{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1.5px rgba(255,255,255,.8);animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.fogbank{position:absolute;width:150vw;height:24vh;background:rgba(255,255,255,.55);filter:blur(30px);border-radius:50%;animation:drift 17s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14vw)}to{transform:translateX(6vw)}}
.sunfx{position:fixed;top:-90px;right:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fffbd0 0%,rgba(255,224,120,.6) 38%,rgba(255,224,120,0) 70%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rbfx{position:fixed;top:2vh;right:-30px;width:220px;height:auto;opacity:.85}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
body.w-storm #flash{animation:flash 7s infinite}
@keyframes flash{0%,91%,96%,100%{opacity:0}92.5%,94.5%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.p-rain,.p-snow,.starp,.fogbank,.bgcloud,.sunfx,body.w-storm #flash{animation:none}}

#app{position:relative;z-index:3;max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:10px 12px calc(12px + env(safe-area-inset-bottom));gap:8px}
header{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:800;color:#26405c;box-shadow:0 3px 0 rgba(120,150,190,.35),0 6px 14px rgba(20,40,70,.12);font-size:14px}
.chip .ico svg,#wIcon svg{width:22px;height:22px;display:block}
#logo{font-size:15px;letter-spacing:.01em}
#coinChip{margin-left:auto;font-variant-numeric:tabular-nums}
#langSel{border:none;font-family:inherit;font-weight:800;font-size:13px;color:#26405c;background:var(--chip);border-radius:999px;padding:7px 8px;box-shadow:0 3px 0 rgba(120,150,190,.35),0 6px 14px rgba(20,40,70,.12)}
#weatherBar{display:flex;align-items:center;justify-content:center}
#weatherBar .chip{font-size:15px;padding:5px 14px}
#hint{background:var(--panel);border-radius:var(--radius);padding:8px 12px;text-align:center;font-size:13.5px;font-weight:700;color:#41618a;box-shadow:0 3px 0 rgba(120,150,190,.3),0 5px 12px rgba(20,40,70,.10)}

#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{
  width:100%;max-width:400px;aspect-ratio:1;
  background:var(--panel);
  border:3px solid rgba(255,255,255,.85);
  border-radius:24px;
  box-shadow:0 6px 0 rgba(110,145,190,.35),0 16px 36px rgba(20,40,70,.22);
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);
  gap:5px;padding:9px;touch-action:none;
}
.cell{background:rgba(116,160,210,.13);box-shadow:inset 0 2px 4px rgba(90,130,180,.14);border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:5%}
.cell svg{width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(30,60,110,.18))}
.cell.src{opacity:.35}
.cell.creature{animation:bounce .9s ease-in-out infinite}
.cell.creature svg{filter:drop-shadow(0 0 8px rgba(255,214,90,.95))}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.cell.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(.5)}65%{transform:scale(1.16)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cell.creature,.cell.pop{animation:none}}
#ghost{position:fixed;pointer-events:none;width:62px;height:62px;z-index:50;transform:translate(-50%,-62%) scale(1.12);display:none;filter:drop-shadow(0 6px 8px rgba(20,40,70,.3))}
#ghost svg{width:100%;height:100%}

#controls{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:9px}
.btn{border:none;font-family:inherit;font-weight:800;font-size:12.5px;color:#31517a;background:linear-gradient(#ffffff,#e9f1fa);border-radius:17px;padding:9px 4px 8px;box-shadow:0 4px 0 #b9cbe0,0 8px 16px rgba(20,40,70,.16);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn .ico{height:26px;display:flex;align-items:center}
.btn .ico svg{width:30px;height:26px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9cbe0,0 3px 8px rgba(20,40,70,.16)}
.btn:disabled{opacity:.5}
.btn:focus-visible,#langSel:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}
#cloudBtn{background:linear-gradient(#f2faff,#cfe9fd);box-shadow:0 4px 0 #93bede,0 8px 16px rgba(20,40,70,.16)}
#cloudBtn:active{box-shadow:0 1px 0 #93bede,0 3px 8px rgba(20,40,70,.16)}
#adBtn{background:linear-gradient(#ffe9b0,#ffc65c);color:#7a4a00;box-shadow:0 4px 0 #d99b2b,0 8px 16px rgba(20,40,70,.16)}
#adBtn:active{box-shadow:0 1px 0 #d99b2b,0 3px 8px rgba(20,40,70,.16)}

#toast{position:fixed;left:50%;bottom:116px;transform:translateX(-50%);background:rgba(38,64,92,.94);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
.fx-float{position:fixed;z-index:55;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 6px rgba(20,40,70,.55);pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-160%)}}
.conf{position:fixed;z-index:55;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:confb .75s ease-out forwards}
@keyframes confb{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@media (prefers-reduced-motion:reduce){.fx-float,.conf{animation-duration:.01s}}

.overlay{position:fixed;inset:0;background:rgba(20,35,60,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fdfdfb;color:#26405c;width:100%;max-width:430px;max-height:78dvh;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow-y:auto;box-shadow:0 -10px 40px rgba(10,25,50,.35)}
.sheet h2{font-size:18px;margin-bottom:12px;text-align:center}
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dexcard{background:#f2f6fb;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:inset 0 2px 4px rgba(90,130,180,.10)}
.dexcard .de{height:52px;display:flex;align-items:center;justify-content:center}
.dexcard .de svg{width:50px;height:50px}
.dexcard .dn{font-weight:800;font-size:12.5px;margin-top:3px}
.dexcard .dr{display:flex;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:#7a8ba3;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.dexcard .dr svg{width:13px;height:13px}
.dexcard .dc{font-size:11px;font-weight:800;color:#3fae6a;margin-top:1px}
.dexcard.locked{opacity:.5;filter:grayscale(1)}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.wbtn{border:none;font-family:inherit;background:#f2f6fb;border-radius:16px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 #d4dfec}
.wbtn svg{width:34px;height:34px}
.wbtn small{font-size:10.5px;font-weight:800;color:#41618a}
.wbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d4dfec}
.sheetbtn{width:100%;border:none;font-family:inherit;font-weight:800;font-size:14px;border-radius:15px;padding:12px;margin-top:8px;cursor:pointer}
#realBtn{background:#dcefff;color:#1e5b8a;box-shadow:0 3px 0 #a8cbe8}
.closebtn{background:#eceff4;color:#5a7290;box-shadow:0 3px 0 #ccd4de}
.sheetbtn:active{transform:translateY(2px);box-shadow:none}

#gallery{position:fixed;inset:0;z-index:100;background:#f4f8fc;overflow:auto;display:none;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;align-content:start}
#gallery.show{display:grid}
#gallery .gi{background:#fff;border-radius:14px;padding:8px;text-align:center;font-size:10px;font-weight:700;color:#5a7290}
#gallery .gi svg{width:100%;height:auto}
</style>
</head>
<body>
<svg id="hills" viewBox="0 0 430 120" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 66 Q90 24 190 58 T430 48 L430 120 L0 120 Z" fill="var(--hill2)"/>
  <circle cx="70" cy="66" r="14" fill="var(--hill2)"/>
  <circle cx="352" cy="56" r="16" fill="var(--hill2)"/>
  <path d="M0 92 Q120 56 250 84 T430 78 L430 120 L0 120 Z" fill="var(--hill1)"/>
  <circle cx="150" cy="90" r="11" fill="var(--hill2)" opacity=".55"/>

    <button class="btn" id="cloudBtn"><span class="ico" id="cloudIco"></span><span id="cloudLbl"></span></button>
    <button class="btn" id="dexBtn"><span class="ico" id="dexIco"></span><span>Meteodex</span></button>
    <button class="btn" id="balloonBtn"><span class="ico" id="balloonIco"></span><span id="balloonLbl"></span></button>
    <button class="btn" id="adBtn"><span class="ico" id="adIco"></span><span id="adLbl"></span></button>
  </div>
</div>

<div id="ghost"></div>
<div id="toast"></div>
<div id="gallery"></div>

<div class="overlay" id="dexOv"><div class="sheet">
  <h2 id="dexTitle">📔 Meteodex</h2>
  <div class="dexgrid" id="dexGrid"></div>
  <button class="sheetbtn closebtn" data-close="dexOv"></button>
</div></div>

<div class="overlay" id="balloonOv"><div class="sheet">

  <div class="wgrid" id="wGrid"></div>
  <button class="sheetbtn" id="realBtn"></button>
  <button class="sheetbtn closebtn" data-close="balloonOv"></button>
</div></div>

/* ---------------- SVG sprite library ---------------- */
const S = inner => `<svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;
const lg = (id,c1,c2) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
const rg = (id,c1,c2) => `<radialGradient id="${id}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}" stop-opacity="0"/></radialGradient>`;
const sh = (rx=20) => `<ellipse cx="50" cy="90" rx="${rx}" ry="5.5" fill="rgba(30,60,110,.16)"/>`;
const dropP = (cx,cy,s) => `M${cx} ${cy-10*s} C${cx+4*s} ${cy-4*s} ${cx+7*s} ${cy-1*s} ${cx+7*s} ${cy+3*s} A${7*s} ${7*s} 0 0 1 ${cx-7*s} ${cy+3*s} C${cx-7*s} ${cy-1*s} ${cx-4*s} ${cy-4*s} ${cx} ${cy-10*s} Z`;
function starPts(cx,cy,ro,ri,n=5,rot=-Math.PI/2){
  const p=[];
  for(let i=0;i<n*2;i++){
    const r=i%2?ri:ro, a=rot+Math.PI*i/n;
    p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));
  }
  return p.join(" ");
}
function rays(n,inner,len,w,color){
  let out="";
  for(let i=0;i<n;i++) out+=`<rect x="${50-w/2}" y="${50-inner-len}" width="${w}" height="${len}" rx="${w/2}" fill="${color}" transform="rotate(${i*360/n} 50 50)"/>`;
  return out;
}
const eyes = (y=50,dx=10,r=3.4) => `<circle cx="${50-dx}" cy="${y}" r="${r}" fill="#2b2b3a"/><circle cx="${50+dx}" cy="${y}" r="${r}" fill="#2b2b3a"/><circle cx="${50-dx+1.2}" cy="${y-1.2}" r="1.1" fill="#fff"/><circle cx="${50+dx+1.2}" cy="${y-1.2}" r="1.1" fill="#fff"/>`;
const blush = (y=58,dx=17,r=4) => `<circle cx="${50-dx}" cy="${y}" r="${r}" fill="#ff9d9d" opacity=".5"/><circle cx="${50+dx}" cy="${y}" r="${r}" fill="#ff9d9d" opacity=".5"/>`;
const smile = (y=58,w=5) => `<path d="M${50-w} ${y} Q50 ${y+4.5} ${50+w} ${y}" stroke="#2b2b3a" stroke-width="2" fill="none" stroke-linecap="round"/>`;
const cloudShape = (fill,op=1) => `<g fill="${fill}" opacity="${op}"><ellipse cx="38" cy="52" rx="20" ry="15"/><ellipse cx="60" cy="46" rx="17" ry="14"/><ellipse cx="52" cy="58" rx="27" ry="14"/></g>`;

 {id:"rain2",w:"rain",r:1,n:{en:"Puddles",it:"Gocciolina",es:"Gotita",fr:"Gouttelette",de:"Tröpfchen",pt:"Gotinha",ja:"アメッポ",ko:"빗방울이",zh:"小雨点",ru:"Капелька"}},
 {id:"storm1",w:"storm",r:2,n:{en:"Zappy",it:"Lampino",es:"Rayito",fr:"Éclairou",de:"Blitzi",pt:"Faísca",ja:"ビリッコ",ko:"번개돌이",zh:"闪闪",ru:"Молник"}},
 {id:"snow1",w:"snow",r:1,n:{en:"Flurry",it:"Fiocchetto",es:"Copito",fr:"Flocon",de:"Flöckchen",pt:"Floquinho",ja:"ユキッペ",ko:"눈송이",zh:"雪宝",ru:"Снежок"}},
 {id:"fog1",w:"fog",r:1,n:{en:"Misty",it:"Nebbiolo",es:"Brumita",fr:"Brumeux",de:"Nebelchen",pt:"Neblininha",ja:"キリフク",ko:"안개미",zh:"雾雾",ru:"Туманчик"}},
 {id:"night1",w:"night",r:1,n:{en:"Moonpaw",it:"Lunetta",es:"Lunita",fr:"Lunou",de:"Mondi",pt:"Luazinha",ja:"ヨルネコ",ko:"달냥이",zh:"月喵",ru:"Ночка"}},
 {id:"rb1",w:"rainbow",r:3,n:{en:"Iris",it:"Iride",es:"Iris",fr:"Iris",de:"Iris",pt:"Íris",ja:"ニジマル",ko:"무지",zh:"彩彩",ru:"Ирис"}}
];
const CHAINS = {water:ITEMS.water,plant:ITEMS.plant,star:ITEMS.star};
const POOLS = {sunny:["sun1","sun2"],rain:["rain1","rain2"],storm:["rain1","storm1"],snow:["snow1"],fog:["fog1"],night:["night1"],rainbow:["sun1","rb1"]};
const RARITY_W = [100,30,10,6];
const CATCH_REWARD = [10,25,60,150];
const SIZE = 36;

/* ---------------- state ---------------- */
const $ = id => document.getElementById(id);
let state = {coins:0, dex:{}, lang:null, board:new Array(SIZE).fill(null), merged:false};
let weather = "sunny", weatherMode = "cycle";

function detectLang(){
  const nav=(navigator.language||"en").slice(0,2).toLowerCase();
  return I18N[nav]?nav:"en";
}
function t(key){ return I18N[state.lang][key]; }
function cname(c){ return c.n[state.lang]||c.n.en; }

function save(){
  try{
    const b=state.board.map(c=>c?(c.k==="i"?{k:"i",c:c.c,l:c.l}:{k:"c",id:c.id}):null);
    localStorage.setItem("meteopark",JSON.stringify({coins:state.coins,dex:state.dex,lang:state.lang,board:b,merged:state.merged}));
  }catch(e){}
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem("meteopark"));
    if(s){state.coins=s.coins||0;state.dex=s.dex||{};state.lang=s.lang;state.merged=!!s.merged;
      if(Array.isArray(s.board)&&s.board.length===SIZE) state.board=s.board;}
  }catch(e){}
}

/* ---------------- UI text ---------------- */
function applyLang(){
  document.documentElement.lang=state.lang;
  $("cloudLbl").textContent=t("cloud");
  $("balloonLbl").textContent=t("balloons");
  $("adLbl").textContent=t("ad");
  $("hint").textContent=state.merged?t("cloudHint"):t("tutorial");
  $("balloonTitle").textContent=t("balloonTitle");
  $("realBtn").textContent=t("real");
  document.querySelectorAll(".closebtn").forEach(b=>b.textContent=t("close"));
  $("wName").textContent=t("weather")[weather];
  renderWeatherGrid(); renderDex(); save();
}

/* ---------------- board ---------------- */
function buildBoard(){
  const bd=$("board");
  for(let i=0;i<SIZE;i++){
    const c=document.createElement("div");
    c.className="cell"; c.dataset.idx=i;
    bd.appendChild(c);
  }
}
function renderBoard(){
  document.querySelectorAll("#board .cell").forEach((el,i)=>{
    const v=state.board[i];
    el.classList.remove("creature");
    if(!v){el.innerHTML="";return;}
    if(v.k==="i"){el.innerHTML=CHAINS[v.c][v.l];}
    else{el.innerHTML=CREATURE_ART[v.id];el.classList.add("creature");}
  });
}
function emptyCells(){
  const out=[]; for(let i=0;i<SIZE;i++) if(!state.board[i]) out.push(i); return out;
}
function updateCoins(){ $("coinVal").textContent=state.coins; }
function cellCenter(idx){
  const el=document.querySelector(`.cell[data-idx="${idx}"]`);
  if(!el) return {x:innerWidth/2,y:innerHeight/2};
  const r=el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function spawnFloat(x,y,text){
  const s=document.createElement("span");
  s.className="fx-float"; s.textContent=text;
  s.style.left=x+"px"; s.style.top=y+"px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1050);
}
function confetti(x,y){
  const colors=["#ff6b9d","#ffc93c","#5cd6ff","#8ce99a","#b197fc"];
  for(let i=0;i<10;i++){
    const s=document.createElement("span");
    s.className="conf";
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.background=colors[i%colors.length];
    const a=Math.random()*Math.PI*2, d=30+Math.random()*40;
    s.style.setProperty("--dx",Math.cos(a)*d+"px");
    s.style.setProperty("--dy",Math.sin(a)*d-20+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

let toastTimer=null;
function toast(msg){
  const el=$("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

/* ---------------- spawning ---------------- */
function spawnItem(){
  const empty=emptyCells();
  if(!empty.length){toast(t("boardFull"));return false;}
  const idx=empty[Math.floor(Math.random()*empty.length)];
  const chains=Object.keys(CHAINS);
  const c=chains[Math.floor(Math.random()*chains.length)];
  const l=Math.random()<0.82?0:1;
  state.board[idx]={k:"i",c,l};
  renderBoard(); popCell(idx); save();
  return true;
}
function popCell(idx){
  const el=document.querySelector(`.cell[data-idx="${idx}"]`);
  if(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
}

function maybeCreature(mergedLvl,guaranteed){
  const chance=guaranteed?1:(0.18+0.09*mergedLvl);
  if(Math.random()>chance) return;
  const empty=emptyCells(); if(!empty.length) return;
  const pool=POOLS[weather].map(id=>CREATURES.find(c=>c.id===id));
  let total=0; pool.forEach(c=>total+=RARITY_W[c.r]);
  let roll=Math.random()*total, pick=pool[0];
  for(const c of pool){ roll-=RARITY_W[c.r]; if(roll<=0){pick=c;break;} }
  const idx=empty[Math.floor(Math.random()*empty.length)];
  state.board[idx]={k:"c",id:pick.id};
  renderBoard(); popCell(idx); toast(t("newCreature")); save();
}

function catchCreature(idx){
  const v=state.board[idx]; if(!v||v.k!=="c") return;
  const cr=CREATURES.find(x=>x.id===v.id);
  const pos=cellCenter(idx);
  state.board[idx]=null;
  state.coins+=CATCH_REWARD[cr.r];
  state.dex[cr.id]=(state.dex[cr.id]||0)+1;
  updateCoins(); renderBoard(); renderDex();
  confetti(pos.x,pos.y);
  spawnFloat(pos.x,pos.y,`+${CATCH_REWARD[cr.r]}`);
  toast(`${cname(cr)}!`);
  save();
}

/* ---------------- drag & merge ---------------- */
let dragSrc=null;
const ghost=$("ghost");
const boardEl=$("board");

boardEl.addEventListener("pointerdown",ev=>{
  const cell=ev.target.closest(".cell"); if(!cell) return;
  const idx=+cell.dataset.idx, v=state.board[idx];
  if(!v) return;
  if(v.k==="c"){catchCreature(idx);return;}
  dragSrc=idx;
  cell.classList.add("src");
  ghost.innerHTML=CHAINS[v.c][v.l];
  ghost.style.display="block";
  moveGhost(ev);
});
document.addEventListener("pointermove",ev=>{
  if(dragSrc===null) return;
  ev.preventDefault();
  moveGhost(ev);
},{passive:false});
document.addEventListener("pointerup",ev=>{
  if(dragSrc===null) return;
  ghost.style.display="none";
  const srcEl=document.querySelector(`.cell[data-idx="${dragSrc}"]`);
  if(srcEl) srcEl.classList.remove("src");
  const target=document.elementFromPoint(ev.clientX,ev.clientY);
  const cell=target&&target.closest?target.closest(".cell"):null;
  const src=dragSrc; dragSrc=null;
  if(!cell) return;
  const dst=+cell.dataset.idx;
  if(dst===src) return;
  dropItem(src,dst);
});
function moveGhost(ev){
  ghost.style.left=ev.clientX+"px";
  ghost.style.top=ev.clientY+"px";
}
function dropItem(src,dst){
  const a=state.board[src], b=state.board[dst];
  if(!a||a.k!=="i") return;
  if(!b){ state.board[dst]=a; state.board[src]=null; renderBoard(); save(); return; }
  if(b.k==="c") return;
  if(b.c===a.c&&b.l===a.l){
    const maxL=CHAINS[a.c].length-1;
    const pos=cellCenter(dst);
    if(a.l<maxL){
      state.board[dst]={k:"i",c:a.c,l:a.l+1};
      state.board[src]=null;
      const gain=(a.l+2)*5;
      state.coins+=gain;
      renderBoard(); popCell(dst); updateCoins();
      spawnFloat(pos.x,pos.y,`+${gain}`);
      if(!state.merged){state.merged=true;$("hint").textContent=t("cloudHint");}
      maybeCreature(a.l+1,false);
    }else{
      state.board[dst]=null; state.board[src]=null;
      state.coins+=100;
      renderBoard(); updateCoins();
      confetti(pos.x,pos.y);
      spawnFloat(pos.x,pos.y,"+100");
      maybeCreature(maxL,true);
    }
    save();
  }else{
    state.board[dst]=a; state.board[src]=b; renderBoard(); save();
  }
}

/* ---------------- weather ---------------- */
function setWeather(w){
  weather=w;
  document.body.className="w-"+w;
  $("wIcon").innerHTML=WICONS[w];
  $("wName").textContent=t("weather")[w];
  renderParticles(w);
}
function renderParticles(w){
  const p=$("particles"); p.innerHTML="";
  const frag=document.createDocumentFragment();
  if(w==="rain"||w==="storm"){
    for(let i=0;i<30;i++){
      const s=document.createElement("span"); s.className="p-rain";
      s.style.left=Math.random()*100+"vw";
      s.style.animationDuration=(0.7+Math.random()*0.7)+"s";
      s.style.animationDelay=(Math.random()*1.5)+"s";
      frag.appendChild(s);
    }
  }else if(w==="snow"){
    for(let i=0;i<24;i++){
      const s=document.createElement("span"); s.className="p-snow";
      const d=4+Math.random()*5;
      s.style.width=d+"px"; s.style.height=d+"px";
      s.style.left=Math.random()*100+"vw";
      s.style.animationDuration=(5+Math.random()*5)+"s";
      s.style.animationDelay=(Math.random()*5)+"s";
      frag.appendChild(s);
    }
  }else if(w==="night"){
    for(let i=0;i<26;i++){
      const s=document.createElement("span"); s.className="starp";
      s.style.left=Math.random()*100+"vw";
      s.style.top=Math.random()*52+"vh";
      s.style.animationDelay=(Math.random()*2.6)+"s";
      frag.appendChild(s);
    }
  }else if(w==="fog"){
    for(let i=0;i<3;i++){
      const s=document.createElement("div"); s.className="fogbank";
      s.style.top=(8+i*28)+"vh";
      s.style.animationDelay=(i*3)+"s";
      frag.appendChild(s);
    }
  }else if(w==="rainbow"){
    const g=document.createElement("div"); g.className="sunfx"; frag.appendChild(g);
    const r=document.createElement("div"); r.className="rbfx";
    r.innerHTML=`<svg viewBox="0 0 100 60"><g fill="none" stroke-linecap="round" opacity=".9"><path d="M6 60 A44 44 0 0 1 94 60" stroke="#ff6b6b" stroke-width="7"/><path d="M15 60 A35 35 0 0 1 85 60" stroke="#ffc93c" stroke-width="7"/><path d="M24 60 A26 26 0 0 1 76 60" stroke="#8ce99a" stroke-width="7"/><path d="M33 60 A17 17 0 0 1 67 60" stroke="#5cd6ff" stroke-width="7"/></g></svg>`;
    frag.appendChild(r);
  }else if(w==="sunny"){
    const g=document.createElement("div"); g.className="sunfx"; frag.appendChild(g);
  }
  p.appendChild(frag);
}
function isNightNow(){ const h=new Date().getHours(); return h>=20||h<7; }
function cycleWeather(){
  if(weatherMode!=="cycle") return;
  if(Math.random()<0.06){ setWeather("rainbow"); return; }
  const pool=isNightNow()
    ?["night","night","night","rain","storm","fog"]
    :["sunny","sunny","rain","rain","storm","snow","fog"];
  setWeather(pool[Math.floor(Math.random()*pool.length)]);
}
setInterval(cycleWeather,75000);

/* real weather via Open-Meteo (works in the packaged app; falls back to demo) */
function wmoToWeather(code,isDay){
  if(code>=95) return "storm";
  if((code>=71&&code<=77)||code===85||code===86) return "snow";
  if((code>=51&&code<=67)||(code>=80&&code<=82)) return "rain";
  if(code===45||code===48) return "fog";
  return isDay?"sunny":"night";
}
function useRealWeather(){
  if(!navigator.geolocation){ toast(t("realFail")); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude,longitude}=pos.coords;
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=weather_code,is_day`;
      const r=await fetch(url); const j=await r.json();
      weatherMode="real";
      setWeather(wmoToWeather(j.current.weather_code,j.current.is_day===1));
      toast(t("realOn"));
      hideOverlay("balloonOv");
    }catch(e){ toast(t("realFail")); }
  },()=>toast(t("realFail")),{timeout:6000});
}

/* ---------------- overlays ---------------- */
function showOverlay(id){ $(id).classList.add("show"); }
function hideOverlay(id){ $(id).classList.remove("show"); }
document.querySelectorAll(".closebtn").forEach(b=>b.addEventListener("click",()=>hideOverlay(b.dataset.close)));
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",ev=>{if(ev.target===o)o.classList.remove("show");}));

function renderDex(){
  const g=$("dexGrid"); g.innerHTML="";
  CREATURES.forEach(c=>{
    const n=state.dex[c.id]||0;
    const d=document.createElement("div");
    d.className="dexcard"+(n?"":" locked");
    d.innerHTML=`<div class="de">${CREATURE_ART[c.id]}</div>
      <div class="dn">${n?cname(c):"???"}</div>
      <div class="dr">${WICONS[c.w]} ${t("rarity")[c.r]}</div>
      <div class="dc">${n?"×"+n:"&nbsp;"}</div>`;
    g.appendChild(d);
  });
}
function renderWeatherGrid(){
  const g=$("wGrid"); g.innerHTML="";
  Object.keys(WICONS).forEach(w=>{
    const b=document.createElement("button");
    b.className="wbtn";
    b.innerHTML=`${WICONS[w]}<small>${t("weather")[w]}</small>`;
    b.addEventListener("click",()=>{weatherMode="manual";setWeather(w);hideOverlay("balloonOv");});
    g.appendChild(b);
  });
}

/* ---------------- buttons ---------------- */
$("cloudBtn").addEventListener("click",()=>{
  const btn=$("cloudBtn");
  if(btn.disabled) return;
  if(spawnItem()){ btn.disabled=true; setTimeout(()=>btn.disabled=false,1200); }
});
$("dexBtn").addEventListener("click",()=>{renderDex();showOverlay("dexOv");});
$("balloonBtn").addEventListener("click",()=>showOverlay("balloonOv"));
$("realBtn").addEventListener("click",useRealWeather);
$("adBtn").addEventListener("click",()=>{
  const btn=$("adBtn");
  state.coins+=50; updateCoins(); toast(t("adDone")); save();
  btn.disabled=true; setTimeout(()=>btn.disabled=false,30000);
});
$("langSel").addEventListener("change",ev=>{state.lang=ev.target.value;applyLang();setWeather(weather);});

/* passive income: each caught species produces coins */
setInterval(()=>{
  const n=Object.keys(state.dex).length;
  if(n>0){ state.coins+=n; updateCoins(); save(); }
},10000);

/* ---------------- init ---------------- */
load();
if(!state.lang) state.lang=detectLang();
const sel=$("langSel");
Object.keys(LANGS).forEach(k=>{
  const o=document.createElement("option"); o.value=k; o.textContent=LANGS[k]; sel.appendChild(o);
});
sel.value=state.lang;
$("logoIco").innerHTML=UI.logo;
$("coinIco").innerHTML=UI.coin;
$("cloudIco").innerHTML=UI.cloud;
$("dexIco").innerHTML=UI.dex;
$("balloonIco").innerHTML=UI.balloon;
$("adIco").innerHTML=UI.ad;
const cloudSvg=`<svg viewBox="0 0 100 100">${cloudShape("rgba(255,255,255,.95)")}</svg>`;
$("cl1").innerHTML=cloudSvg; $("cl2").innerHTML=cloudSvg;
buildBoard();
if(state.board.every(c=>!c)){
  const seed=[["water",0],["water",0],["water",0],["plant",0],["plant",0],["star",0]];
  const empty=emptyCells();
  seed.forEach(([c,l])=>{
    const i=empty.splice(Math.floor(Math.random()*empty.length),1)[0];
    state.board[i]={k:"i",c,l};
  });
}
renderBoard(); updateCoins(); applyLang();
const qw=new URLSearchParams(location.search).get("w");
if(qw&&WICONS[qw]){ weatherMode="manual"; setWeather(qw); }
else setWeather(isNightNow()?"night":"sunny");

/* sprite QA gallery: open with #gallery */
if(location.hash==="#gallery"){
  const g=$("gallery"); g.classList.add("show");
  Object.entries(CHAINS).forEach(([name,arr])=>arr.forEach((svg,i)=>{
    const d=document.createElement("div"); d.className="gi"; d.innerHTML=svg+`${name} ${i+1}`; g.appendChild(d);
  }));
  CREATURES.forEach(c=>{
    const d=document.createElement("div"); d.className="gi"; d.innerHTML=CREATURE_ART[c.id]+c.id; g.appendChild(d);
  });
  Object.entries(WICONS).forEach(([name,svg])=>{
    const d=document.createElement("div"); d.className="gi"; d.innerHTML=svg+name; g.appendChild(d);
  });
}
</script>
