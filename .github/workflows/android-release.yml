name: Publish Android (Play Store)

# Manual trigger: run this from the Actions tab once the GitHub secrets are set.
# Required secrets:
#   ANDROID_KEYSTORE_BASE64   – the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD – keystore password
#   ANDROID_KEY_ALIAS         – key alias (meteopark)
#   ANDROID_KEY_PASSWORD      – key password
#   PLAY_SERVICE_ACCOUNT_JSON – Google Play service-account JSON (for auto-upload)
# Note: the very FIRST upload to Google Play must be done manually in the Play
# Console (the API cannot create the app). After that, this workflow publishes
# every new version automatically to the chosen track.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      upload_to_play:
        description: "Upload to Play Store (needs PLAY_SERVICE_ACCOUNT_JSON; off = just build the signed AAB)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor
        run: npm ci

      - name: Sync web app
        run: |
          cp ../prototype/index.html www/index.html
          npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.keystore

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteo-park-signed-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Play Store
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zorzetto.meteopark
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
